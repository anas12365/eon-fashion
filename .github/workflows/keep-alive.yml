name: Keep Supabase Database Alive

# Runs every Monday and Thursday at 6am UTC — well under Supabase's
# 7-day free-tier inactivity pause window, with margin for a missed run.
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch: # allows manually triggering a run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API to keep the database active
        run: |
          curl -sf https://eon-fashion-production.up.railway.app/api/products/ \
            && echo "Ping succeeded" \
            || echo "Ping failed (backend may be down — check Railway)"
